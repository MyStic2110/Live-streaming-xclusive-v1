version: "3.9"
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  securelytix-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "5432:5432"
    volumes:
      - ./Calcutta:/usr/share/zoneinfo/Asia/Calcutta:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  securelytix-sdk:
    image: securelytix2026/dev-sdk:ml-integration-pipeline
    env_file:
      - ./python-agent/.env
    environment:
      VAULT_PORT: 8080
      DATABASE_URL: "postgresql://vault:vault@securelytix-postgres:5432/vault?sslmode=disable"
      API_KEY: ${SECURELYTIX_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      - securelytix-postgres
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  swarm-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: swarm
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - ./Calcutta:/usr/share/zoneinfo/Asia/Calcutta:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8081:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - BASE_URL=http://localhost:8081/
      - SEARXNG_BASE_URL=http://localhost:8081/
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Mem0 vector store for the Swarm Copilot. Runs as a SERVER (not embedded) so the
  # Node CLI bridge and the in-process agent can access memories concurrently —
  # embedded on-disk Qdrant holds an exclusive lock and fails under concurrent use.
  # Point the agents at it with QDRANT_HOST=localhost (already in python-agent/.env).
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
